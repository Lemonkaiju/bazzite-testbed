name: Build LemonKaijuOS ISO
on:
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build ISO
        run: |
          curl -fsSL https://raw.githubusercontent.com/blue-build/cli/main/install.sh | bash
          DATE=$(date +%Y%m%d)
          bluebuild generate-iso --iso-name LemonKaijuOS-${DATE}.iso --output-dir ./output recipe recipes/recipe.yml

      - name: Upload to GitHub Pages
        run: |
          DATE=$(date +%Y%m%d)
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git checkout --orphan gh-pages 2>/dev/null || git checkout gh-pages
          git rm -rf . 2>/dev/null || true
          cp ./output/LemonKaijuOS-${DATE}.iso ./LemonKaijuOS.iso
          echo '<!DOCTYPE html><html><head><title>LemonKaijuOS Download</title><meta http-equiv="refresh" content="0; url=LemonKaijuOS.iso"></head><body><h1>LemonKaijuOS Download</h1><p><a href="LemonKaijuOS.iso">Click here to download</a></p></body></html>' > index.html
          git add .
          git commit -m "Deploy LemonKaijuOS-${DATE}"
          git push origin gh-pages --force

      - name: Create Release
        run: |
          DATE=$(date +%Y%m%d)
          gh release create "${DATE}" --title "LemonKaijuOS ${DATE}" --notes "LemonKaijuOS ISO image for ${DATE}. Download: https://lemonkaiju.github.io/bazzite-testbed/" --latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}