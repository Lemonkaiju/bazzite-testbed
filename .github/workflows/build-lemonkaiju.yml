name: Build LemonKaijuOS ISO
on:
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build ISO
        run: |
          curl -fsSL https://raw.githubusercontent.com/blue-build/cli/main/install.sh | bash
          DATE=$(date +%Y%m%d)
          bluebuild generate-iso --iso-name LemonKaijuOS-${DATE}.iso --output-dir ./output recipe recipes/recipe.yml

      - name: Split ISO into Chunks
        run: |
          DATE=$(date +%Y%m%d)
          cd ./output
          
          # Split ISO into 1.9GB chunks (under 2GB limit)
          split -b 1900M -d LemonKaijuOS-${DATE}.iso LemonKaijuOS-${DATE}.part.
          
          # Create checksum file
          sha256sum LemonKaijuOS-${DATE}.iso > LemonKaijuOS-${DATE}.sha256
          
          # Create reassembly script using echo
          echo '#!/bin/bash' > reassemble.sh
          echo 'set -e' >> reassemble.sh
          echo '' >> reassemble.sh
          echo 'echo "Reassembling LemonKaijuOS ISO..."' >> reassemble.sh
          echo '' >> reassemble.sh
          echo '# Find all part files' >> reassemble.sh
          echo 'parts=$(ls LemonKaijuOS-*.part.* 2>/dev/null | sort -V)' >> reassemble.sh
          echo '' >> reassemble.sh
          echo 'if [ -z "$parts" ]; then' >> reassemble.sh
          echo '    echo "No part files found!"' >> reassemble.sh
          echo '    exit 1' >> reassemble.sh
          echo 'fi' >> reassemble.sh
          echo '' >> reassemble.sh
          echo 'echo "Found parts: $parts"' >> reassemble.sh
          echo 'echo "Reassembling..."' >> reassemble.sh
          echo '' >> reassemble.sh
          echo '# Concatenate parts' >> reassemble.sh
          echo 'cat $parts > LemonKaijuOS.iso' >> reassemble.sh
          echo '' >> reassemble.sh
          echo '# Verify checksum' >> reassemble.sh
          echo 'if [ -f LemonKaijuOS.sha256 ]; then' >> reassemble.sh
          echo '    echo "Verifying checksum..."' >> reassemble.sh
          echo '    sha256sum -c LemonKaijuOS.sha256' >> reassemble.sh
          echo '    if [ $? -eq 0 ]; then' >> reassemble.sh
          echo '        echo "Checksum verification passed!"' >> reassemble.sh
          echo '        echo "LemonKaijuOS.iso ready for use!"' >> reassemble.sh
          echo '    else' >> reassemble.sh
          echo '        echo "Checksum verification failed!"' >> reassemble.sh
          echo '        exit 1' >> reassemble.sh
          echo '    fi' >> reassemble.sh
          echo 'else' >> reassemble.sh
          echo '    echo "No checksum file found - skipping verification"' >> reassemble.sh
          echo 'fi' >> reassemble.sh
          echo '' >> reassemble.sh
          echo 'echo "Done!"' >> reassemble.sh
          
          chmod +x reassemble.sh
          
          # List files
          ls -lh

      - name: Create Release with Chunks
        run: |
          DATE=$(date +%Y%m%d)
          
          # Create release
          gh release create "${DATE}" \
            --title "LemonKaijuOS ${DATE}" \
            --notes "LemonKaijuOS ISO image for ${DATE}

📥 Download Instructions:
1. Download all part files (LemonkaijuOS-${DATE}.part.*)
2. Download reassemble.sh and LemonKaijuOS-${DATE}.sha256
3. Run: chmod +x reassemble.sh && ./reassemble.sh

The ISO is split into chunks due to GitHub's 2GB file size limit.

Hardware Detection:
- Dell Latitude 5320/7320: Tablet mode and rotation support
- Intel systems: WiFi and Bluetooth optimization
- Universal: Sensor proxy, fingerprint, gaming optimizations" \
            --latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload All Files to Release
        run: |
          DATE=$(date +%Y%m%d)
          cd ./output
          
          # Upload all part files
          for file in LemonKaijuOS-${DATE}.part.*; do
            echo "Uploading $file..."
            gh release upload "${DATE}" "$file" --clobber
          done
          
          # Upload other files
          gh release upload "${DATE}" reassemble.sh --clobber
          gh release upload "${DATE}" LemonKaijuOS-${DATE}.sha256 --clobber
          
          echo "All files uploaded!"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}