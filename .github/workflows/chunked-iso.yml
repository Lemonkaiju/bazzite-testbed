name: Chunked ISO Build
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      
    steps:
      - uses: actions/checkout@v5
      - name: Build and Chunk ISO
        run: |
          curl -fsSL https://raw.githubusercontent.com/blue-build/cli/main/install.sh | bash
          DATE=$(date +%Y%m%d)
          TIME=$(date +%H%M%S)
          TAG="${DATE}-${TIME}"
          echo "TAG=${TAG}" >> $GITHUB_ENV
          bluebuild generate-iso --iso-name LemonKaijuOS-${DATE}.iso --output-dir ./output recipe recipes/recipe.yml
          cd ./output
          split -b 1900M -d LemonKaijuOS-${DATE}.iso LemonKaijuOS-${DATE}.part.
          sha256sum LemonKaijuOS-${DATE}.iso > LemonKaijuOS-${DATE}.sha256
          ls -lh
      - name: Create Release and Upload
        run: |
          cd ./output
          echo "Creating release with tag: ${{ env.TAG }}"
          gh release create "${{ env.TAG }}" --title "LemonKaijuOS ${{ env.TAG }}" --notes "LemonKaijuOS ISO with chunked download

📥 Download Instructions:
1. Download all part files
2. Download checksum file  
3. Use installer app to reassemble" --latest
          for file in LemonKaijuOS-*.part.*; do
            echo "Uploading $file..."
            gh release upload "${{ env.TAG }}" "$file"
          done
          for file in LemonKaijuOS-*.sha256; do
            echo "Uploading $file..."
            gh release upload "${{ env.TAG }}" "$file"
          done
          echo "Upload complete!"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}