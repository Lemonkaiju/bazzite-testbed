name: Generate ISO
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'recipes/**'
      - 'files/scripts/**'
      - '.github/workflows/generate-iso.yml'

jobs:
  build-iso:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build ISO
        run: |
          # Download and install BlueBuild CLI to the current directory
          curl -fsSL https://blue-build.org/install.sh | BIN_DIR=. bash
          
          # Run the locally installed binary directly
          ./bluebuild generate-iso recipe recipes/recipe.yml \
            --iso-name bazzite-latitude.iso \
            --output-dir ./output

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bazzite-latitude-iso
          path: ./output/*.iso
          if-no-files-found: error
          retention-days: 1
