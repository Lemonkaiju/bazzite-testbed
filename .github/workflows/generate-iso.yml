name: Generate ISO
on:
  workflow_dispatch: # Allows you to manually trigger it when you need a fresh ISO

jobs:
  build-iso:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required for GitHub Pages and releases
      pages: write      # Required for GitHub Pages
      packages: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build ISO
        run: |
          # 1. Install BlueBuild CLI
          curl -fsSL https://raw.githubusercontent.com/blue-build/cli/main/install.sh | bash

          # 2. Generate ISO with date-based name
          DATE=$(date +%Y%m%d)
          bluebuild generate-iso \
            --iso-name LemonKaijuOS-${DATE}.iso \
            --output-dir ./output \
            recipe recipes/recipe.yml

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./output/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Create GitHub Release with Download Link
        run: |
          DATE=$(date +%Y%m%d)
          PAGE_URL="${{ steps.deployment.outputs.page_url }}"
          
          # Create release pointing to GitHub Pages
          gh release create "${DATE}" \
            --title "LemonKaijuOS ${DATE}" \
            --notes "LemonKaijuOS ISO image for ${DATE}

📥 **Download Link**: ${PAGE_URL}

The ISO is hosted via GitHub Pages due to GitHub's 2GB release asset limit.

This provides direct download without size restrictions." \
            --latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}