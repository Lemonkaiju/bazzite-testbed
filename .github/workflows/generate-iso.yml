name: Generate ISO
on:
  workflow_dispatch: # trigger manually, or automatically after a successful image build
  workflow_run:
    workflows: ["bluebuild"]
    types: [completed]
    branches: [main]

jobs:
  build-iso:
    runs-on: ubuntu-latest
    # Manual trigger always runs; workflow_run trigger only runs on success
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build ISO
        uses: jasonn3/build-container-installer@v1.4.0
        id: build
        with:
          arch: x86_64
          image_name: lemonkaijuos
          image_repo: ghcr.io/lemonkaiju
          image_tag: latest
          version: 43          # Fedora base version (matches Bazzite stable)
          variant: Kinoite     # KDE variant matches Bazzite
          iso_name: lemonkaijuos.iso
          image_signed: "false"    # image built with --no-sign, no cosign sig exists
          enrollment_password: ""  # leave empty to skip secure-boot enrollment
          web_ui: false
          # kickstart_file not supported by this action; use extra_boot_params or
          # press Tab at GRUB and add: inst.ks=hd:LABEL=<label>:/lemonkaijuos.ks

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: lemonkaijuos-iso
          path: ${{ steps.build.outputs.iso_path }}/${{ steps.build.outputs.iso_name }}
          if-no-files-found: error
          retention-days: 7
