name: Generate ISO
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'recipes/**'
      - 'files/scripts/**'

jobs:
  build-iso:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build ISO
        run: |
          # 1. Install BlueBuild CLI
          bash <(curl -fsSL https://blue-build.org/install.sh)
          
          # 2. Add to PATH for this specific shell session
          export PATH="/home/runner/.local/bin:$PATH"
          
          # 3. Verify installation
          bluebuild --version
          
          # 4. Generate ISO
          bluebuild generate-iso recipe recipes/recipe.yml \
            --iso-name bazzite-latitude.iso \
            --output-dir ./output

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bazzite-latitude-iso
          path: ./output/*.iso
          if-no-files-found: error
          retention-days: 1
