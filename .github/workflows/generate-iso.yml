name: Generate ISO
on:
  workflow_dispatch: # Allow manual trigger
  push:
    branches:
      - main
    paths:
      - 'recipes/**'
      - 'files/scripts/**'

jobs:
  build-iso:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install BlueBuild CLI
        run: |
          # Official installer script
          bash <(curl -fsSL https://blue-build.org/install.sh)
          # Ensure it's in the PATH
          echo "/home/runner/.local/bin" >> $GITHUB_PATH

      - name: Generate ISO
        run: |
          # Use the CLI to generate the ISO
          bluebuild generate-iso recipe recipes/recipe.yml \
            --iso-name bazzite-latitude.iso \
            --output-dir ./output

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bazzite-latitude-iso
          path: ./output/*.iso
          if-no-files-found: error
          retention-days: 1
