name: Generate ISO
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'recipes/**'
      - 'files/scripts/**'
      - '.github/workflows/generate-iso.yml'

jobs:
  build-iso:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build ISO
        run: |
          # 1. Install BlueBuild CLI from the correct GitHub URL
          curl -fsSL https://raw.githubusercontent.com/blue-build/cli/main/install.sh | bash
          
          # 2. Verify installation
          bluebuild --version
          
          # 3. Generate ISO
          bluebuild generate-iso recipe recipes/recipe.yml \
            --iso-name bazzite-latitude.iso \
            --output-dir ./output

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bazzite-latitude-iso
          path: ./output/*.iso
          if-no-files-found: error
          retention-days: 1
