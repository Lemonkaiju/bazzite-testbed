name: Generate ISO
on:
  workflow_dispatch: # Allows you to manually trigger it if you ever need a fresh USB

jobs:
  build-iso:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build ISO
        run: |
          # 1. Install BlueBuild CLI
          curl -fsSL https://raw.githubusercontent.com/blue-build/cli/main/install.sh | bash
          
          # 2. Generate ISO 
          bluebuild generate-iso \
            --iso-name bazzite-latitude.iso \
            --output-dir ./output \
            recipe recipes/recipe.yml

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bazzite-latitude-iso
          path: ./output/*.iso
          if-no-files-found: error
          retention-days: 1
