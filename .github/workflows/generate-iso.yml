name: Generate ISO
on:
  workflow_dispatch: # Allow manual trigger
  push:
    branches:
      - main
    paths:
      - 'recipes/**'
      - 'files/scripts/**'

jobs:
  build-iso:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install BlueBuild CLI
        run: |
          curl -L https://github.com/blue-build/cli/releases/latest/download/bluebuild-linux-x86_64 -o bluebuild
          chmod +x bluebuild
          sudo mv bluebuild /usr/local/bin/

      - name: Generate ISO
        run: |
          # This command builds a netinstall ISO that will pull your custom image
          # The identity 'recipe' tells it to look in the recipes folder
          bluebuild generate-iso recipe recipes/recipe.yml \
            --iso-name bazzite-latitude.iso \
            --output-dir ./output

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bazzite-latitude-iso
          path: ./output/*.iso
          if-no-files-found: error
          retention-days: 1
