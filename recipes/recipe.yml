---
# Custom Bazzite build for Dell Latitude 5320/7320 Tablet & 2-in-1
name: bazzite-testbed
description: Tablet-optimized Bazzite with developer tools and light gaming support.

base-image: ghcr.io/ublue-os/bazzite
image-version: latest

modules:
  - type: rpm-ostree
    install:
      # Hardware enablement
      - iio-sensor-proxy
      - fprintd
      - fprintd-pam
      # Gaming & 3D compatibility
      - mesa-vulkan-drivers.i686
      - vulkan-loader.i686
      # Terminal tools
      - zsh
      - fish

  - type: default-flatpaks@v1
    notify: true
    system:
      install:
        # Development
        - org.godotengine.Godot
        - com.visualstudio.code
        # Web & Remote
        - com.google.Chrome
        - com.microsoft.Edge
        - org.mozilla.Thunderbird
        - com.rustdesk.RustDesk
        # Media & Creativity
        - com.spotify.Client
        - org.kde.krita
        - org.audacityteam.Audacity
        - org.blender.Blender
        - org.tuxpaint.Tuxpaint
        - com.github.xournalpp.xournalpp
        - io.lmms.LMMS
        # Games
        - info.beyondallreason.bar
        - com.github.Anuken.Mindustry
        - net.minetest.Minetest
        - com.play0ad.zeroad
        - net.veloren.veloren

  - type: systemd
    system:
      enabled:
        - sshd
        - iio-sensor-proxy
        - fprintd

  - type: script
    scripts:
      - dell-tuning.sh
