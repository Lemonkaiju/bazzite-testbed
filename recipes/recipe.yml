---
# LemonKaijuOS - Privacy-focused family operating system
name: lemonkaijuos
description: Privacy-first family OS with PIN authentication, security profiles, and STFD integration.

base-image: ghcr.io/ublue-os/bazzite
image-version: stable

modules:
  - type: rpm-ostree
    install:
      # Hardware enablement
      - iio-sensor-proxy
      - fprintd
      - fprintd-pam
      # Python runtime and Fedora-packaged deps
      - python3-pip
      - python3-flask
      - python3-psutil
      - python3-pyudev
      - python3-pyyaml
      - python3-passlib

  - type: default-flatpaks@v1
    notify: true
    system:
      install:
        # Essential apps (always installed)
        - org.mozilla.firefox
        - org.onlyoffice.desktopeditors
        - org.remmina.Remmina
        # All other apps installed via first-boot wizard

  - type: systemd
    system:
      enabled:
        - iio-sensor-proxy
        - fprintd
        # SSH disabled by default, enabled via first-boot if STFD integration chosen

  - type: files
    # Overlays files/system/ onto image root.
    # All LemonKaijuOS content is pre-staged there — no path hacks needed.

  - type: script
    scripts:
      - hardware-tuning.sh
      - lemonkaijuos-setup.sh
