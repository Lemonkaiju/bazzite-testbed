---
# Custom Bazzite build for Dell Latitude 5320/7320 Tablet & 2-in-1
name: bazzite-testbed
description: Tablet-optimized Bazzite with developer tools and light gaming support.

base-image: ghcr.io/ublue-os/bazzite
image-version: latest

modules:
  - type: rpm-ostree
    install:
      # Hardware enablement
      - iio-sensor-proxy
      - fprintd
      - fprintd-pam
      # Gaming & 3D compatibility
      - mesa-vulkan-drivers.i686
      - vulkan-loader.i686
      # Terminal tools
      - zsh
      - fish

  - type: default-flatpaks@v1
    notify: true
    system:
      install:
        # Development
        - org.godotengine.Godot
        - com.visualstudio.code
        # Web & Remote
        - com.google.Chrome
        - com.microsoft.Edge
        - org.mozilla.Thunderbird
        - com.rustdesk.RustDesk
        # Media
        - com.spotify.Client

  - type: systemd
    system:
      enabled:
        - sshd
        - iio-sensor-proxy
        - fprintd

  - type: script
    scripts:
      - dell-tuning.sh
