---
# LemonKaijuOS - Privacy-focused family operating system
name: lemonkaijuos
description: Privacy-first family OS with PIN authentication, security profiles, and STFD integration.

base-image: ghcr.io/ublue-os/bazzite-nvidia-open
image-version: stable

modules:
  - type: rpm-ostree
    install:
      # Hardware enablement
      - iio-sensor-proxy
      - fprintd
      - fprintd-pam
      # Gaming compatibility
      - libgdiplus
      # Python runtime and Fedora-packaged deps
      - python3-pip
      - python3-flask
      - python3-psutil
      - python3-pyudev
      - python3-pyyaml
      - python3-passlib

  - type: default-flatpaks@v1
    notify: true
    system:
      install:
        # Essential apps (always installed)
        - org.mozilla.firefox
        - org.onlyoffice.desktopeditors
        - org.remmina.Remmina
        # All other apps installed via first-boot wizard

  - type: systemd
    system:
      enabled:
        - iio-sensor-proxy
        - fprintd
        - sshd   # needed for remote debugging; can be removed before production

  - type: files
    files:
      - source: system   # maps files/system/ → / in the image
        destination: /

  - type: script
    scripts:
      - hardware-tuning.sh
      - lemonkaijuos-setup.sh
